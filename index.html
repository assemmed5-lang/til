/* ══════════════════════════════════════════════
   PEDAGOGICAL ENGINE
   
   Phases auto-sequence:
     For each verse N (0-indexed):
       PHASE "listen_N"  → play verse N alone, (10 + N) times
       PHASE "exam_0..N" → recite verses 0..N together
         PASS → move to listen_N+1  (or done if last verse)
         FAIL → retry: play failed_verses 2 times → re-exam same range
   ══════════════════════════════════════════════ */

const G = id => document.getElementById(id);

/* ─── STORAGE ─── */
function loadBank() { try { return JSON.parse(localStorage.getItem("tilawa_bank")||"[]"); } catch { return []; } }

/* ─── SRT PARSER ─── */
/* Returns cues where each cue = one SRT block (may be a phrase or a whole verse) */
function parseSRT(txt) {
  const cues = [];
  const toSec = (h,mn,s) => +h*3600 + +mn*60 + parseFloat(s.replace(",","."));
  txt = txt.replace(/^\uFEFF/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n").trim();
  const lines = txt.split("\n").map(l => l.trim()).filter(l => l !== "");
  const timingRe = /(\d+):(\d+):(\d+[,\.]\d+)\s*-->\s*(\d+):(\d+):(\d+[,\.]\d+)/;
  const seqRe = /^\d+$/;
  let i = 0;
  while (i < lines.length) {
    if (seqRe.test(lines[i]) && i+1 < lines.length && timingRe.test(lines[i+1])) i++;
    const m = lines[i] && lines[i].match(timingRe);
    if (!m) { i++; continue; }
    i++;
    const textLines = [];
    while (i < lines.length) {
      if (seqRe.test(lines[i]) && i+1 < lines.length && timingRe.test(lines[i+1])) break;
      if (timingRe.test(lines[i])) break;
      textLines.push(lines[i]);
      i++;
    }
    const text = textLines.join(" ").trim();
    if (!text) continue;
    const start = toSec(m[1],m[2],m[3]);
    const end   = toSec(m[4],m[5],m[6]);
    if (end <= start) continue;
    cues.push({ start, end, text });
  }
  return cues;
}

/* ─── NORMALISE ─── */
function norm(s) {
  return s
    .replace(/[\u064B-\u065F\u0670\u0671]/g,"")
    .replace(/[أإآا]/g,"ا").replace(/[ىي]/g,"ي").replace(/ة/g,"ه")
    .replace(/\s+/g," ").trim().toLowerCase();
}

/* ─── FIND VERSE TIMING ─── */
/*
   Strategy: concatenate all SRT cue texts, find where verseText starts/ends
   in that stream, then map back to audio start/end timestamps.
   Works whether SRT has 1 word/line or many words/line.
*/
function findVerseWindow(allCues, verseText) {
  if (!allCues.length || !verseText) return null;

  const nv = norm(verseText);
  const nvWords = nv.split(/\s+/).filter(Boolean);
  if (!nvWords.length) return null;

  // Build word-level list from all cues (each cue may have multiple words)
  const wordList = []; // { word, start, end }
  allCues.forEach(cue => {
    const ws = cue.text.split(/\s+/).filter(Boolean);
    ws.forEach((w, i) => {
      // Distribute time evenly across words inside one cue
      const dur = (cue.end - cue.start) / ws.length;
      wordList.push({
        word: norm(w),
        start: cue.start + i * dur,
        end:   cue.start + (i+1) * dur
      });
    });
  });

  // Slide over wordList looking for best match with nvWords
  let bestStart = -1, bestEnd = -1, bestScore = 0;
  for (let i = 0; i <= wordList.length - nvWords.length; i++) {
    let score = 0;
    for (let j = 0; j < nvWords.length; j++) {
      if (wordList[i+j] && wordList[i+j].word === nvWords[j]) score++;
    }
    const ratio = score / nvWords.length;
    if (ratio > bestScore) {
      bestScore = ratio;
      bestStart = wordList[i].start;
      bestEnd   = wordList[i + nvWords.length - 1].end;
    }
    if (bestScore === 1) break; // perfect match, stop early
  }

  // If no good match (< 40%), fall back to dividing equally
  if (bestScore < 0.4) return null;
  return { start: bestStart, end: bestEnd, score: bestScore };
}

/* Legacy: find individual word cues for word-highlight display */
function findVerseCues(allCues, verseText) {
  if (!allCues.length || !verseText) return [];
  const nv = norm(verseText);
  const nvWords = nv.split(/\s+/).filter(Boolean);
  if (!nvWords.length) return [];

  // Build word-level list
  const wordList = [];
  allCues.forEach(cue => {
    const ws = cue.text.split(/\s+/).filter(Boolean);
    ws.forEach((w, i) => {
      const dur = (cue.end - cue.start) / ws.length;
      wordList.push({
        word: norm(w),
        text: w,
        start: cue.start + i * dur,
        end:   cue.start + (i+1) * dur
      });
    });
  });

  // Find best matching window
  let bestIdx = 0, bestScore = 0;
  for (let i = 0; i <= wordList.length - nvWords.length; i++) {
    let score = 0;
    for (let j = 0; j < nvWords.length; j++) {
      if (wordList[i+j] && wordList[i+j].word === nvWords[j]) score++;
    }
    if (score > bestScore) { bestScore = score; bestIdx = i; }
    if (bestScore === nvWords.length) break;
  }

  return wordList.slice(bestIdx, bestIdx + nvWords.length);
}

verseCues = parseSRT(srtVersesText);

/* ─── BANK UI ─── */

/* ══════════════════════════════════════════════
   SESSION START
   ══════════════════════════════════════════════ */
function startSession() {
  curVerseIdx = 0;
  examUpTo    = 0;
  phase       = "idle";
  retryMissing= [];
  const p = document.querySelector("audio");
  if (!p) { alert("audio element missing"); return; }
  if (!p.src || !p.src.endsWith(audioUrl)) { p.src = audioUrl; p._loadedUrl = audioUrl; p.load(); }
  G("card-listen").classList.remove("hidden");
  G("card-recite").classList.add("hidden");
  G("card-result").classList.add("hidden");
  buildProgressTrack();
  beginListenPhase();
}

/* ─── PROGRESS TRACK ─── */
function buildProgressTrack() {
  const track = G("progress-track"); track.innerHTML = "";
  // One step per verse (listen) + one per exam = 2*N steps total
  // We just show N verse dots
  verses.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "pt-step"; d.id = "pt-" + i;
    track.appendChild(d);
  });
}
function updateProgressTrack() {
  verses.forEach((_, i) => {
    const d = G("pt-" + i);
    if (!d) return;
    if (i < curVerseIdx) d.className = "pt-step done";
    else if (i === curVerseIdx && phase === "listen") d.className = "pt-step current";
    else if (phase === "exam" || phase === "retry_listen") d.className = "pt-step" + (i <= examUpTo ? " exam" : "");
    else d.className = "pt-step";
  });
}

/* ══════════════════════════════════════════════
   LISTEN PHASE — play verse curVerseIdx alone
   reps = 10 + curVerseIdx
   ══════════════════════════════════════════════ */
function beginListenPhase() {
  phase = "listen";
  updateProgressTrack();

  const reps = 10 + Math.max(0, curVerseIdx - 1);  // v1→10, v2→10, v3→11, v4→12 …
  repTotal = reps; repCur = 0;
  G("btn-listen-start").disabled = false;
  playing = false; stopped = false;

  const vText = verses[curVerseIdx];
  G("phase-label").textContent = "الآية " + (curVerseIdx+1) + " — استمع " + reps + " مرات";
  G("ayah-full-text").textContent = vText;
  G("ayah-full-box").classList.remove("hidden");
  G("attempt-badge").textContent = "المحاولة الأولى";
  G("rep-cur").textContent = "0";
  G("prog-fill").style.width = "0%";
  G("prog-pct").textContent = "0%";
  G("rep-of").innerHTML = "من أصل <strong>" + reps + "</strong> تكرارات";
  G("rep-state").textContent = "جاهز للبدء";
  G("btn-listen-start").textContent = "▶ ابدأ الاستماع";
  G("btn-listen-start").disabled = false;
  G("btn-listen-start").classList.remove("hidden");
  G("btn-listen-stop").classList.add("hidden");
  if (G("btn-go-recite")) G("btn-go-recite").classList.add("hidden");
  G("card-listen").classList.remove("hidden");
  G("card-recite").classList.add("hidden");
  G("card-result").classList.add("hidden");
  G("card-listen").scrollIntoView({ behavior:"smooth", block:"start" });

  // DIRECT: verseCues[i] = timing exact du verset i, zéro matching
  const vc = verseCues[curVerseIdx];
  if (vc) {
    window._activeWindow = { start: vc.start, end: vc.end };
  } else {
    // fallback si SRT versets mal aligné
    const last = verseCues[verseCues.length-1];
    const total = last ? last.end : 600;
    const chunk = total / Math.max(verses.length, 1);
    window._activeWindow = { start: curVerseIdx * chunk, end: (curVerseIdx+1) * chunk };
  }
  // wordCues filtrés dans la fenêtre du verset pour highlight
  const ws = window._activeWindow.start, we = window._activeWindow.end;
  window._activeCues = wordCues.filter(c => c.start >= ws - 0.1 && c.end <= we + 0.1);
}

/* ══════════════════════════════════════════════
   RETRY LISTEN — play failed verses 2 times
   ══════════════════════════════════════════════ */
function beginRetryListenPhase(missingVerseIdxList) {
  phase = "retry_listen";
  updateProgressTrack();
  retryMissing = missingVerseIdxList;

  // DIRECT: fusionner les fenêtres des versets échoués
  let winStart = Infinity, winEnd = 0;
  missingVerseIdxList.forEach(vi => {
    const vc = verseCues[vi];
    if (vc) { winStart = Math.min(winStart, vc.start); winEnd = Math.max(winEnd, vc.end); }
  });
  if (winStart === Infinity) { winStart = 0; winEnd = verseCues.length ? verseCues[verseCues.length-1].end : 60; }
  window._activeWindow = { start: winStart, end: winEnd };
  window._activeCues   = wordCues.filter(c => c.start >= winStart - 0.1 && c.end <= winEnd + 0.1);

  repTotal = 2; repCur = 0; playing = false; stopped = false;

  const names = missingVerseIdxList.map(i => "الآية "+(i+1)).join(" + ");
  G("phase-label").textContent = "مراجعة: " + names + " — مرتان";
  G("ayah-full-text").textContent = missingVerseIdxList.map(i=>verses[i]).join("\n");
  G("ayah-full-box").classList.remove("hidden");
  G("attempt-badge").textContent = "إعادة الاستماع";
  G("rep-cur").textContent = "0";
  G("prog-fill").style.width = "0%";
  G("prog-pct").textContent = "0%";
  G("rep-of").innerHTML = "من أصل <strong>2</strong> تكرارات";
  G("rep-state").textContent = "جاهز للبدء";
  G("btn-listen-start").textContent = "▶ ابدأ المراجعة";
  G("btn-listen-start").disabled = false;
  G("btn-listen-start").classList.remove("hidden");
  G("btn-listen-stop").classList.add("hidden");
  if (G("btn-go-recite")) G("btn-go-recite").classList.add("hidden");
  G("card-listen").classList.remove("hidden");
  G("card-recite").classList.add("hidden");
  G("card-result").classList.add("hidden");
  G("card-listen").scrollIntoView({ behavior:"smooth", block:"start" });
}

/* ══════════════════════════════════════════════
   EXAM PHASE — recite verses 0..examUpTo
   ══════════════════════════════════════════════ */
function beginExamPhase() {
  phase = "exam";
  updateProgressTrack();
  finalTx = "";
  lastFullTx = "";

  const from = examSolo ? curVerseIdx : 0;
  const to   = curVerseIdx;
  const range = verses.slice(from, to + 1);
  const label = examSolo
    ? "امتحان: الآية " + (curVerseIdx + 1) + " منفردة"
    : (curVerseIdx === 0 ? "امتحان: الآية 1" : "امتحان: الآيات 1 إلى " + (curVerseIdx + 1));
  G("phase-label-recite").textContent = label;
  G("exam-ayahs-text").textContent = range.join("\n");
  G("exam-ayahs-box").classList.remove("hidden");
  G("rec-hint").textContent = examSolo
    ? "قل الآية " + (curVerseIdx + 1) + " بصوت واضح"
    : "قل الآيات من 1 إلى " + (curVerseIdx + 1) + " بصوت واضح";

  G("btn-rec-start").classList.remove("hidden");
  G("btn-rec-stop").classList.add("hidden");
  G("rec-status").textContent = "اضغط الزر وابدأ في التلاوة";
  G("transcript").style.display = "none";
  G("mic-ring").classList.remove("on");
  G("card-recite").classList.remove("hidden");
  G("card-result").classList.add("hidden");
  G("card-recite").scrollIntoView({ behavior:"smooth", block:"start" });
}

/* ══════════════════════════════════════════════
   PLAY ONE REP — uses window._activeWindow {start,end}
   and window._activeCues for word highlight
   ══════════════════════════════════════════════ */
function playOnce(onEnd) {
  const p = G("audio-player");
  if (!audioUrl) {
    alert("⚠️ الرجاء تحميل ملف MP3 وملف SRT أولاً.");
    stopped = true;
    G("btn-listen-start").classList.remove("hidden");
    G("btn-listen-stop").classList.add("hidden");
    return;
  }
  const win = window._activeWindow;
  if (!win || win.end <= win.start + 0.1) { setTimeout(onEnd, 200); return; }

  const startTime = win.start;
  const endTime   = win.end;
  let ended = false;

  function safeEnd() {
    if (ended) return;
    ended = true;
    if (window._wTimer) { clearInterval(window._wTimer); window._wTimer = null; }
    p.onended = null;
    p.oncanplaythrough = null;
    G("current-word").textContent = "—";
    G("current-word-label").textContent = "—";
    onEnd();
  }

  function doPlay() {
    if (window._wTimer) { clearInterval(window._wTimer); window._wTimer = null; }
    p.onended = null; // disable onended — we manage end via interval only
    G("current-word").textContent = "—";

    // Seek then play
    p.currentTime = startTime;

    const activeCues = window._activeCues || [];
    const expectedDuration = (endTime - startTime) * 1000; // ms
    let lastTime = -1;
    let stuckCount = 0;

    function startInterval() {
      window._wTimer = setInterval(() => {
        if (stopped) { p.pause(); safeEnd(); return; }
        const t = p.currentTime;
        // Detect stuck / not advancing (after 1s of interval)
        if (t === lastTime) {
          stuckCount++;
          if (stuckCount > 15) { // ~1.2s with no progress
            p.pause();
            safeEnd();
            return;
          }
        } else {
          stuckCount = 0;
          lastTime = t;
        }
        if (t >= endTime) {
          p.pause();
          safeEnd();
          return;
        }
        const cue = activeCues.find(c => t >= c.start && t < c.end);
        if (cue) {
          G("current-word").textContent = cue.text;
          G("current-word-label").textContent = cue.text;
        }
      }, 80);
    }

    if (phase === "listen") {
      const versDur = endTime - startTime;
      const half = Math.ceil(repTotal / 2);
      const targetDur = repCur < half ? 26 : 23;
      p.playbackRate = Math.min(Math.max(versDur / targetDur, 0.65), 1.0);
    } else {
      p.playbackRate = 1.0;
    }
    p.play().then(() => {
      startInterval();
    }).catch(err => {
      console.warn("play() failed:", err);
      safeEnd();
    });
  }

  function loadAndPlay() {
    p._loadedUrl = audioUrl;
    p.src = audioUrl;
    p.onended = null;
    p.onloadedmetadata = null;
    p.oncanplaythrough = null;
    p.load();
    p.oncanplaythrough = function() {
      p.oncanplaythrough = null;
      doPlay();
    };
    p.onerror = safeEnd;
  }

  if (p.readyState >= 2) {
    doPlay();
  } else if (p._loadedUrl !== audioUrl) {
    loadAndPlay();
  } else {
    p.oncanplaythrough = function() {
      p.oncanplaythrough = null;
      doPlay();
    };
    p.onerror = safeEnd;
  }
}

/* ─── REP LOOP ─── */
function startReps() {
  repCur = 0; playing = true; stopped = false;
  G("btn-listen-start").classList.add("hidden");
  G("btn-listen-stop").classList.remove("hidden");
  G("rep-of").innerHTML = "من أصل <strong>" + repTotal + "</strong> تكرارات";
  tick();
}

/* examSolo=true → test verse curVerseIdx alone ; examSolo=false → test 0..curVerseIdx */
let examSolo = true;

function tick() {
  if (stopped) { playing = false; return; }
  if (repCur >= repTotal) {
    playing = false;
    G("btn-listen-stop").classList.add("hidden");
    G("rep-state").textContent = "✅ انتهى الاستماع! جاري الانتقال للتسميع...";
    setTimeout(() => {
      if (phase !== "retry_listen") {
        examUpTo = curVerseIdx;
        examSolo = true;
      }
      // Une répétition de rappel avant l'examen
      const oldRepTotal = repTotal;
      const oldRepCur = repCur;
      repTotal = 1; repCur = 0;
      playOnce(() => {
        repTotal = oldRepTotal;
        repCur = oldRepCur;
        G("audio-player").playbackRate = 1.0;
        beginExamPhase();
      });
    }, 1500);
    return;
  }
  G("rep-state").textContent = "▶ التكرار رقم " + (repCur+1) + " من " + repTotal + "...";
  playOnce(() => {
    if (stopped) return;
    repCur++;
    G("rep-cur").textContent = repCur;
    const pct = Math.round((repCur / repTotal) * 100);
    G("prog-fill").style.width = pct + "%";
    G("prog-pct").textContent = pct + "%";
    const win = window._activeWindow;
    const segDur = win ? Math.max((win.end - win.start) * 1000, 600) : 600;
    const rate = (phase === "listen") ? G("audio-player").playbackRate : 1.0;
    const pauseDur = (segDur / rate) * 1.5;

    // Activer micro pendant la pause
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let pauseRecog = null;
    if (SR && phase === "listen") {
      pauseRecog = new SR();
      pauseRecog.lang = "ar-SA";
      pauseRecog.continuous = true;
      pauseRecog.interimResults = true;
      pauseRecog.onresult = e => {
        let txt = "";
        for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
        G("current-word").textContent = txt.trim().split(/\s+/).slice(-1)[0] || "—";
      };
      pauseRecog.onstart = () => {
        G("current-word").textContent = "—";
      };
      pauseRecog.start();
    }

    setTimeout(() => {
      if (pauseRecog) { try { pauseRecog.stop(); } catch(e){} }
      G("current-word").textContent = "—";
      tick();
    }, pauseDur);
  });
}

G("btn-listen-start").addEventListener("click", () => {
  if (phase === "listen" || phase === "retry_listen") {
    G("btn-listen-start").disabled = true;
    startReps();
  }
});
G("btn-listen-stop").addEventListener("click", () => {
  stopped = true;
  const p = G("audio-player");
  p.pause();
  p.onended = null;
  p.oncanplaythrough = null;
  if (window._wTimer) { clearInterval(window._wTimer); window._wTimer = null; }
  G("btn-listen-stop").classList.add("hidden");
  G("btn-listen-start").classList.remove("hidden");
  G("btn-listen-start").disabled = false;
  G("btn-listen-start").textContent = "▶ متابعة الاستماع";
  G("rep-state").textContent = "متوقف — اضغط للمتابعة";
});

/* ══════════════════════════════════════════════
   SPEECH RECOGNITION
   ══════════════════════════════════════════════ */
function startRecog() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("التعرف الصوتي غير مدعوم.\nاستخدم Chrome أو Edge."); return; }
  recog = new SR();
  recog.lang = "ar-SA"; recog.continuous = true; recog.interimResults = true; recog.maxAlternatives = 3;
  recog.onstart = () => {
    G("mic-ring").classList.add("on");
    G("rec-status").textContent = "جارٍ الاستماع... تكلّم الآن!";
    const t = G("transcript"); t.style.display = "block"; t.textContent = "...";
    G("current-word-label").textContent = "أنت تقول:";
    G("current-word").textContent = "—";
  };
  recog.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalTx += e.results[i][0].transcript + " ";
      else interim += e.results[i][0].transcript;
    }
    const candidate = (finalTx + interim).trim();
    if (candidate.length >= lastFullTx.length) lastFullTx = candidate;
    G("transcript").textContent = lastFullTx || "...";
    G("current-word-label").textContent = "أنت تقول:";
    const lastWord = lastFullTx.trim().split(/\s+/).filter(Boolean).slice(-1)[0] || "—";
    G("current-word").textContent = lastWord;
  };
  recog.onerror = e => { G("mic-ring").classList.remove("on"); G("rec-status").textContent = e.error === "no-speech" ? "لم يُكتشف صوت، حاول مجدداً" : "خطأ: " + e.error; };
  recog.onend = () => G("mic-ring").classList.remove("on");
  recog.start();
}
G("btn-rec-start").addEventListener("click", () => {
  G("btn-rec-start").classList.add("hidden");
  G("btn-rec-stop").classList.remove("hidden");
  startRecog();
});
G("btn-rec-stop").addEventListener("click", () => {
  if (recog) recog.stop();
  G("btn-rec-stop").classList.add("hidden");
  G("rec-status").textContent = "جارٍ التحليل...";
  setTimeout(() => {
    // If no result was ever marked "final" (common with continuous mode),
    // fall back to the last transcript shown on screen (interim results)
    // instead of evaluating against an empty string.
    if (!finalTx.trim() && lastFullTx) finalTx = lastFullTx;
    evaluate();
  }, 900);
});

/* ══════════════════════════════════════════════
   EVALUATE — checks verses 0..examUpTo
   Identifies which specific verses failed
   ══════════════════════════════════════════════ */
function evaluate() {
  const heard = norm(finalTx);
  const grid = G("word-grid"); grid.innerHTML = "";

  const from = examSolo ? curVerseIdx : 0;
  const to   = curVerseIdx;
  const allWords = [];
  const verseResults = [];

  for (let vi = from; vi <= to; vi++) {
    const words = verses[vi].split(/\s+/).filter(Boolean);
    let versePassed = true;
    words.forEach(w => {
      const ok = heard.includes(norm(w));
      if (!ok) versePassed = false;
      allWords.push({ w, ok, vi });
    });
    verseResults.push({ vi, passed: versePassed });
  }

  allWords.forEach(({ w, ok }) => {
    const pill = document.createElement("span");
    pill.className = "word-pill " + (ok ? "wok" : "wmiss");
    pill.textContent = (ok ? "✓ " : "✗ ") + w;
    grid.appendChild(pill);
  });

  const found  = allWords.filter(x=>x.ok).length;
  const total  = allWords.length;
  const score  = Math.round((found / total) * 100);
  const failedVerses = verseResults.filter(r=>!r.passed).map(r=>r.vi);

  const box = G("score-box"); box.className = "score-box";
  const nm  = G("n-missing"), nx = G("n-extra");
  nm.classList.add("hidden"); nx.classList.add("hidden");

  if (score === 100) {
    box.classList.add("ex");
    G("score-num").textContent = "100%";
    G("score-lbl").textContent = "ممتاز! أحسنت يا بطل! 🌟";
    G("score-msg").textContent = examSolo
      ? "أتقنت الآية " + (curVerseIdx+1) + " منفردة!"
      : "حفظت الآيات من 1 إلى " + (curVerseIdx+1) + " بشكل صحيح!";
    G("card-result").classList.remove("hidden");
    G("card-result").scrollIntoView({ behavior:"smooth", block:"start" });
    setTimeout(advanceAfterPass, 1800);
  } else {
    const cls = score >= 70 ? "gd" : "rtry";
    box.classList.add(cls);
    G("score-num").textContent = score + "%";
    G("score-lbl").textContent = score >= 70 ? "جيد جداً — تقريباً صحيح!" : "لا بأس — نحتاج مزيداً من الاستماع!";
    G("score-msg").textContent = "الآيات التي تحتاج مراجعة: " + failedVerses.map(i=>"الآية "+(i+1)).join("، ");
    nm.classList.remove("hidden");
    nm.textContent = "⚠️ الكلمات الناقصة: " + allWords.filter(x=>!x.ok).map(x=>x.w).join("  —  ");
    nx.classList.remove("hidden");
    nx.textContent = "ستستمع للآيات الناقصة مرتين تلقائياً، ثم تُسمِّع مجدداً.";
    G("card-result").classList.remove("hidden");
    G("card-result").scrollIntoView({ behavior:"smooth", block:"start" });
    setTimeout(() => {
      G("card-result").classList.add("hidden");
      const allIndices = [];
      const from = examSolo ? curVerseIdx : 0;
      for (let i = from; i <= curVerseIdx; i++) allIndices.push(i);
      beginRetryListenPhase(allIndices);
    }, 3000);
  }
}

/* ─── ADVANCE AFTER PASS ─── */
function playGroupOnce(then) {
  // Joue tous les versets 0..curVerseIdx en séquence une fois
  const indices = [];
  for (let i = 0; i <= curVerseIdx; i++) indices.push(i);
  function playNext() {
    if (!indices.length) { G("audio-player").playbackRate = 1.0; then(); return; }
    const vi = indices.shift();
    const vc = verseCues[vi];
    if (!vc) { playNext(); return; }
    window._activeWindow = { start: vc.start, end: vc.end };
    window._activeCues = wordCues.filter(c => c.start >= vc.start - 0.1 && c.end <= vc.end + 0.1);
    G("audio-player").playbackRate = 1.0;
    playOnce(playNext);
  }
  playNext();
}

function advanceAfterPass() {
  if (examSolo) {
    if (curVerseIdx === 0) {
      const next = curVerseIdx + 1;
      if (next >= verses.length) { showDone(); return; }
      curVerseIdx = next;
      examSolo = true;
      beginListenPhase();
    } else {
      // Joue la partie longue une fois avant l'examen groupe
      playGroupOnce(() => {
        examSolo = false;
        beginExamPhase();
      });
    }
  } else {
    const next = curVerseIdx + 1;
    if (next >= verses.length) { showDone(); return; }
    curVerseIdx = next;
    examSolo = true;
    beginListenPhase();
  }
}

function showDone() {
  G("card-result").classList.remove("hidden");
  const box = G("score-box"); box.className = "score-box ex";
  G("score-num").textContent = "🎉";
  G("score-lbl").textContent = "أحسنت! حفظت السورة كاملة!";
  G("score-msg").textContent = "لقد أتقنت جميع الآيات بنجاح!";
  G("n-missing").classList.add("hidden");
  G("n-extra").classList.add("hidden");
  G("card-result").scrollIntoView({ behavior:"smooth", block:"start" });
}

/* ─── RESTART ─── */
G("btn-restart").addEventListener("click", () => {
  curVerseIdx=0; examUpTo=0; phase="idle"; repCur=0; repTotal=10;
  playing=false; stopped=false; finalTx=""; lastFullTx="";
  if (window._wTimer) clearInterval(window._wTimer);
  G("card-listen").classList.add("hidden");
  G("card-recite").classList.add("hidden");
  G("card-result").classList.add("hidden");
  G("current-word").textContent = "—";
  G("current-word-label").textContent = "في انتظار التشغيل";
  window.scrollTo({ top:0, behavior:"smooth" });
});

/* ─── INIT ─── */
/* ─── INIT ─── */
navigator.mediaDevices.getUserMedia({ audio: true })
  .then(stream => { stream.getTracks().forEach(t => t.stop()); startSession(); })
  .catch(() => startSession());
</script>
