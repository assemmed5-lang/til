name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build Everything
        run: |
          mkdir -p www
          cp index.html www/
          npm install
          npx cap init Tilawa com.tilawa.sourate --web-dir www
          npx cap add android
          # Ici, on ajoute le plugin
          npm install @capacitor-community/speech-recognition
          # On modifie le code java automatiquement (la méthode directe)
          echo "import com.getcapacitor.community.speechrecognition.SpeechRecognition;" > temp_import.txt
          sed -i '/import com.getcapacitor.BridgeActivity;/r temp_import.txt' android/app/src/main/java/com/tilawa/sourate/MainActivity.java
          sed -i 's/public class MainActivity extends BridgeActivity {/public class MainActivity extends BridgeActivity {\n  @Override\n  public void onCreate(android.os.Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    registerPlugin(SpeechRecognition.class);\n  }/' android/app/src/main/java/com/tilawa/sourate/MainActivity.java
          # On compile
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          path: android/app/build/outputs/apk/debug/app-debug.apk
