name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Build and Patch
        run: |
          mkdir -p www
          cp index.html www/
          cp *.mp3 www/ 2>/dev/null || true

          echo '{"name":"tilawa","version":"1.0.0","private":true}' > package.json

          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor-community/speech-recognition@5

          python3 -c "import json; open('capacitor.config.json','w').write(json.dumps({'appId':'com.tilawa.sourate','appName':'Tilawa','webDir':'www','androidScheme':'https','android':{'allowMixedContent':True}}, indent=2))"

          npx cap add android
          npx cap sync android

          MANIFEST=$(find android/app -name "AndroidManifest.xml" | head -1)
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n</manifest>|' "$MANIFEST"

          python3 -c "open('android/app/src/main/java/com/tilawa/sourate/MainActivity.java','w').write('package com.tilawa.sourate;\nimport com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;\nimport com.getcapacitor.community.speechrecognition.SpeechRecognition;\npublic class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(SpeechRecognition.class);\n        super.onCreate(savedInstanceState);\n    }\n}\n')"

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
