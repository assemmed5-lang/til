name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - name: Setup and Build
        run: |
          mkdir -p www
          cp index.html www/
          cp *.mp3 www/ 2>/dev/null || true
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/speech-recognition
          npx cap init Tilawa com.tilawa.sourate --web-dir www
          npx cap add android
          # Juste l'ajout du plugin sans toucher au reste
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
