name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Tilawa" "com.tilawa.sourate" --web-dir www
          mkdir www
          cp index.html www/
          cp *.mp3 www/ 2>/dev/null || true
          npx cap add android
          npm install @capacitor-community/speech-recognition
          npx cap sync
          MANIFEST=$(find android/app -name "AndroidManifest.xml" | head -1)
          sed -i "s|</manifest>|<uses-permission android:name=\"android.permission.RECORD_AUDIO\"/><uses-permission android:name=\"android.permission.INTERNET\"/></manifest>|" "$MANIFEST"
          MAIN=$(find android/app -name "MainActivity.java" | head -1)
          sed -i 's/import com.getcapacitor.BridgeActivity;/import com.getcapacitor.BridgeActivity;\nimport com.capacitorjs.plugins.speechrecognition.SpeechRecognitionPlugin;/' "$MAIN"
          sed -i 's/public class MainActivity extends BridgeActivity {}/public class MainActivity extends BridgeActivity {\n  @Override\n  public void onCreate(android.os.Bundle savedInstanceState) {\n    registerPlugin(SpeechRecognitionPlugin.class);\n    super.onCreate(savedInstanceState);\n  }\n}/' "$MAIN"      
      - name: Set Gradle version
        run: |
          cd android
          sed -i 's|gradle-.*-all.zip|gradle-8.13-all.zip|g' gradle/wrapper/gradle-wrapper.properties
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"
      - uses: actions/upload-artifact@v4
        with:
          name: tilawa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
