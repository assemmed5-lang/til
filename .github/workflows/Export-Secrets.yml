name: Export Secrets
on: [push]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" > keystore.b64
      - name: Show vars
        run: |
          echo "STORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "ALIAS=${{ secrets.KEY_ALIAS }}"
          echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}"
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore.b64
